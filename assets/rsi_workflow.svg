<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="410" viewBox="0 0 1440 410" role="img" aria-labelledby="title desc">
<title id="title">Data foundations for RSI research</title><desc id="desc">Conceptual workflow. VeriInk handles synthetic practice; AlignLedger handles human feedback. Training and evaluation are external and require separate evidence.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#42658a"/></marker><style>.h{font:700 24px Arial,sans-serif;fill:#172b40}.s{font:17px Arial,sans-serif;fill:#4c6072}.l{stroke:#42658a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1440" height="410" rx="20" fill="#f7f8fa"/><text x="40" y="48" class="h">DATA FOUNDATIONS FOR RSI RESEARCH</text><text x="40" y="78" class="s">Human-guided workflow · schematic only · adapters and learning systems are external</text>
<rect x="40" y="125" width="300" height="150" rx="12" fill="#eaf2fc" stroke="#779bc3"/><text x="64" y="165" class="h">VeriInk</text><text x="64" y="202" class="s">Controlled synthetic practice</text><text x="64" y="232" class="s">Seeds · labels · bounds · hashes</text>
<rect x="395" y="125" width="300" height="150" rx="12" fill="#eaf5ef" stroke="#76a18b"/><text x="419" y="165" class="h">AlignLedger</text><text x="419" y="202" class="s">Review and human corrections</text><text x="419" y="232" class="s">Revisions · provenance · exports</text>
<rect x="750" y="125" width="300" height="150" rx="12" fill="#fff" stroke="#a5a8af" stroke-dasharray="7 5"/><text x="774" y="165" class="h">External learning</text><text x="774" y="202" class="s">Dataset admission and training</text><text x="774" y="232" class="s">Independent evaluation</text>
<rect x="1105" y="125" width="295" height="150" rx="12" fill="#fff" stroke="#a5a8af" stroke-dasharray="7 5"/><text x="1129" y="165" class="h">Next reviewed round</text><text x="1129" y="202" class="s">Preserve failures and unknowns</text><text x="1129" y="232" class="s">Promotion needs evidence</text>
<path d="M340 200H382" class="l"/><path d="M695 200H737" class="l"/><path d="M1050 200H1092" class="l"/><path d="M1252 288V335H190V288" class="l"/><text x="437" y="377" class="s">Feedback informs the next iteration; a loop does not guarantee improvement.</text></svg>
